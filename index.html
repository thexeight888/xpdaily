<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XP Daily</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0d0d; --surface:#161616; --card:#1e1e1e; --border:#2a2a2a;
      --accent:#c8f135; --accent-dim:rgba(200,241,53,0.10);
      --done:#4ade80; --done-dim:rgba(74,222,128,0.10);
      --fail:#f87171; --fail-dim:rgba(248,113,113,0.10);
      --text:#f0f0f0; --muted:#555; --radius:10px;
      --xp:#fbbf24;
      --m0:#c8f135; --m1:#38bdf8; --m2:#f97316; --m3:#a78bfa; --m4:#f472b6; --m5:#34d399; --m6:#fb923c; --m7:#60a5fa; --m8:#f43f5e;
    }
    body { background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh; padding:0 0 80px; }

    /* NAV */
    nav { position:sticky; top:0; z-index:100; background:rgba(13,13,13,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); display:flex; gap:4px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    .nav-btn { flex-shrink:0; background:transparent; border:1.5px solid var(--border); border-radius:99px; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:0.78rem; font-weight:600; padding:6px 13px; cursor:pointer; transition:all 0.18s; white-space:nowrap; }
    .nav-btn:hover { border-color:var(--accent); color:var(--accent); }
    .nav-btn.active { background:var(--accent); border-color:var(--accent); color:#0d0d0d; }
    .nav-add { background:var(--surface); border-color:var(--border); color:var(--accent); font-size:1rem; padding:6px 12px; }
    .nav-add:hover { background:var(--accent); color:#0d0d0d; }

    /* HERO */
    .hero { padding:20px 16px 0; max-width:820px; margin:0 auto; }
    .hero-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .avatar { width:52px; height:52px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; }
    .hero-info { flex:1; }
    .hero-name { font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.15em; }
    .hero-level { font-size:1.3rem; font-weight:700; line-height:1.1; }
    .hero-level span { color:var(--accent); }
    .xp-bar-meta { display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:10px; color:var(--muted); margin-bottom:5px; }
    .xp-val { color:var(--xp); }
    .xp-bar-bg { height:7px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:12px; }
    .xp-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--xp),#f59e0b); transition:width 0.5s; }
    .streak-row { display:flex; gap:8px; margin-bottom:14px; }
    .streak-badge { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; text-align:center; flex:1; }
    .streak-badge.fire { border-color:#f97316; }
    .streak-val { font-family:'Space Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--accent); }
    .streak-badge.fire .streak-val { color:#f97316; }
    .streak-label { font-size:0.6rem; color:var(--muted); margin-top:2px; }

    /* ACHIEVEMENTS */
    .section-title { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .achievements-grid { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .badge { display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:0.72rem; color:var(--muted); }
    .badge.unlocked { border-color:var(--xp); color:var(--text); background:rgba(251,191,36,0.08); }
    .badge-icon { font-size:0.95rem; filter:grayscale(1); opacity:0.4; }
    .badge.unlocked .badge-icon { filter:none; opacity:1; }

    /* SKILLS */
    .skills-overview { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
    .skill-row { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:border-color 0.18s; }
    .skill-row:hover { border-color:var(--accent); }
    .skill-emoji { font-size:1.1rem; width:26px; text-align:center; }
    .skill-info { flex:1; min-width:0; }
    .skill-name { font-size:0.83rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .skill-rank { font-family:'Space Mono',monospace; font-size:0.62rem; color:var(--muted); margin-top:1px; }
    .skill-xp-bar { width:55px; flex-shrink:0; }
    .skill-xp-bg { height:4px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:3px; }
    .skill-xp-fill { height:100%; border-radius:99px; background:var(--xp); transition:width 0.4s; }
    .skill-lv { font-family:'Space Mono',monospace; font-size:0.62rem; color:var(--xp); text-align:right; }

    /* MONTH NAV */
    .month-nav { display:flex; gap:6px; padding:0 16px; max-width:820px; margin:0 auto; overflow-x:auto; scrollbar-width:none; }
    .month-nav::-webkit-scrollbar { display:none; }
    .month-btn { flex-shrink:0; background:var(--surface); border:1.5px solid var(--border); border-radius:8px; color:var(--muted); font-family:'Space Mono',monospace; font-size:0.7rem; font-weight:700; padding:7px 12px; cursor:pointer; transition:all 0.18s; text-align:center; white-space:nowrap; }
    .month-btn:hover:not(.locked-month) { border-color:var(--accent); color:var(--accent); }
    .month-btn.locked-month { opacity:0.35; cursor:default; }
    .month-label-sub { font-size:0.57rem; color:var(--muted); display:block; margin-top:2px; font-family:'Space Grotesk',sans-serif; font-weight:400; }

    /* SECTION */
    .section { display:none; padding:0 16px; max-width:820px; margin:0 auto; }
    .section.active { display:block; }

    /* DASHBOARD */
    .dashboard { margin:12px 0 16px; }
    .dash-hero { display:flex; gap:8px; margin-bottom:10px; }
    .dash-big { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 8px; text-align:center; }
    .dash-big-val { font-family:'Space Mono',monospace; font-size:1.6rem; font-weight:700; color:var(--accent); line-height:1; }
    .dash-big-label { font-size:0.62rem; color:var(--muted); margin-top:4px; }
    .dash-months { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin-bottom:10px; }
    .dash-months::-webkit-scrollbar { display:none; }
    .dash-month-card { flex-shrink:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; text-align:center; min-width:65px; }
    .dash-month-val { font-family:'Space Mono',monospace; font-size:0.95rem; font-weight:700; }
    .dash-month-label { font-size:0.58rem; color:var(--muted); margin-top:3px; }
    .dash-bar-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; }
    .dash-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .dash-bar-row:last-child { margin-bottom:0; }
    .dash-bar-name { font-size:0.65rem; color:var(--muted); width:38px; flex-shrink:0; }
    .dash-bar-bg { flex:1; height:5px; background:var(--border); border-radius:99px; overflow:hidden; }
    .dash-bar-fill { height:100%; border-radius:99px; }
    .dash-bar-pct { font-family:'Space Mono',monospace; font-size:0.62rem; color:var(--muted); width:30px; text-align:right; }

    /* ADD MONTH */
    .add-month-wrap { margin:16px 0 8px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn-add-months { background:var(--surface); border:1.5px dashed var(--border); border-radius:8px; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:0.78rem; font-weight:600; padding:8px 14px; cursor:pointer; transition:all 0.18s; }
    .btn-add-months:hover { border-color:var(--accent); color:var(--accent); }

    /* TOPBAR */
    .section-topbar { display:flex; align-items:flex-start; justify-content:space-between; margin:14px 0; flex-wrap:wrap; gap:10px; }
    .topbar-info { font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); line-height:1.8; }
    .topbar-info strong { color:var(--accent); font-size:0.95rem; }
    .topbar-btns { display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
    .btn-sm { background:transparent; border:1.5px solid var(--border); border-radius:99px; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:0.72rem; font-weight:600; padding:5px 11px; cursor:pointer; transition:all 0.18s; }
    .btn-sm:hover { border-color:var(--accent); color:var(--accent); }
    .btn-sm.danger:hover { border-color:var(--fail); color:var(--fail); }

    /* CHANGELOG */
    .changelog { margin-bottom:12px; display:flex; flex-direction:column; gap:5px; }
    .changelog-title { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
    .changelog-entry { background:var(--surface); border-left:2px solid var(--accent); border-radius:0 6px 6px 0; padding:6px 10px; font-size:0.76rem; line-height:1.5; }
    .changelog-entry .cl-meta { font-family:'Space Mono',monospace; font-size:9px; color:var(--accent); margin-bottom:2px; }
    .changelog-entry .cl-reason { color:var(--muted); }

    /* PROGRESS */
    .progress-wrap { margin-bottom:14px; }
    .progress-meta { display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:6px; }
    .progress-meta strong { color:var(--done); }
    .bar-bg { height:5px; background:var(--border); border-radius:99px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:99px; transition:width 0.5s; }

    /* STATS */
    .stats { display:flex; gap:7px; margin-bottom:14px; }
    .stat { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 6px; text-align:center; }
    .stat-val { font-family:'Space Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--accent); }
    .stat-label { font-size:0.6rem; color:var(--muted); margin-top:3px; }

    /* GRID */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:6px; }
    .card { background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius); padding:9px 7px 8px; cursor:pointer; user-select:none; transition:border-color 0.18s,background 0.18s,transform 0.1s; display:flex; flex-direction:column; align-items:center; gap:5px; position:relative; }
    .card:hover:not(.done):not(.failed) { border-color:var(--accent); background:var(--accent-dim); }
    .card:active { transform:scale(0.96); }
    .card.done { border-color:var(--done); background:var(--done-dim); }
    .card.failed { border-color:var(--fail); background:var(--fail-dim); }
    .card-date { font-family:'Space Mono',monospace; font-size:7.5px; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; }
    .card.done .card-date { color:var(--done); }
    .card.failed .card-date { color:var(--fail); }
    .day-num { font-size:0.58rem; color:var(--muted); }
    .check-ring { width:32px; height:32px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; transition:all 0.18s; }
    .card.done .check-ring { border-color:var(--done); background:rgba(74,222,128,0.18); }
    .card.failed .check-ring { border-color:var(--fail); background:rgba(248,113,113,0.15); }
    .checkmark { opacity:0; transform:scale(0.4); transition:opacity 0.2s,transform 0.2s; }
    .card.done .checkmark,.card.failed .checkmark { opacity:1; transform:scale(1); }
    .card-reps { font-size:0.63rem; font-weight:600; color:var(--muted); }
    .card.done .card-reps { color:var(--done); }
    .card.failed .card-reps { color:var(--fail); }
    .note-btn { position:absolute; top:3px; right:3px; background:none; border:none; cursor:pointer; font-size:10px; opacity:0.2; transition:opacity 0.18s; padding:2px; line-height:1; }
    .card:hover .note-btn,.note-btn.has-note { opacity:1; }
    .x-btn { position:absolute; bottom:3px; left:3px; background:none; border:none; cursor:pointer; font-size:11px; opacity:0.18; transition:opacity 0.18s; padding:2px; line-height:1; }
    .card:hover .x-btn { opacity:0.7; }
    .card.failed .x-btn { opacity:1; }

    /* LOCKED */
    .locked-overlay { display:flex; flex-direction:column; align-items:center; gap:12px; padding:50px 20px; text-align:center; color:var(--muted); }
    .lock-icon { font-size:2rem; }
    .locked-overlay p,.month-locked p { font-size:0.86rem; line-height:1.6; max-width:300px; }
    .month-locked { display:flex; flex-direction:column; align-items:center; gap:12px; padding:36px 20px; text-align:center; color:var(--muted); }

    /* CONFIG BAR */
    .config-bar { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
    .config-bar label { display:flex; flex-direction:column; gap:5px; font-size:0.72rem; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; }
    .config-bar input,.config-bar select { background:var(--card); border:1.5px solid var(--border); border-radius:6px; color:var(--text); font-family:'Space Mono',monospace; font-size:0.95rem; padding:7px 10px; width:100px; }
    .config-bar input:focus,.config-bar select:focus { outline:none; border-color:var(--accent); }
    .config-bar button { background:var(--accent); border:none; border-radius:6px; color:#0d0d0d; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.82rem; padding:8px 14px; cursor:pointer; }

    /* MODALS */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:200; align-items:center; justify-content:center; padding:16px; }
    .modal-backdrop.open { display:flex; }
    .modal { background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:400px; display:flex; flex-direction:column; gap:14px; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:flex-start; }
    .modal-title { font-weight:700; font-size:0.95rem; }
    .modal-sub { font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); margin-top:3px; }
    .modal-close { background:var(--card); border:1px solid var(--border); border-radius:50%; color:var(--muted); cursor:pointer; font-size:0.85rem; width:26px; height:26px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .modal-field { display:flex; flex-direction:column; gap:5px; }
    .modal-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
    .modal-label span { color:#f87171; font-size:0.68rem; }
    .modal input,.modal textarea,.modal select { background:var(--card); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:0.88rem; padding:9px 11px; transition:border-color 0.18s; }
    .modal input[type=number],.modal input[type=text] { font-family:'Space Mono',monospace; }
    .modal input[type=date],.modal select { width:100%; }
    .modal textarea { resize:vertical; min-height:75px; line-height:1.5; width:100%; }
    .modal input:focus,.modal textarea:focus,.modal select:focus { outline:none; border-color:var(--accent); }
    .modal textarea::placeholder,.modal input::placeholder { color:var(--muted); }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; }
    .btn-primary { background:var(--accent); border:none; border-radius:7px; color:#0d0d0d; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.82rem; padding:9px 16px; cursor:pointer; }
    .btn-secondary { background:transparent; border:1.5px solid var(--border); border-radius:7px; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:0.82rem; padding:9px 12px; cursor:pointer; }
    .btn-secondary:hover { border-color:var(--fail); color:var(--fail); }
    .btn-danger { background:transparent; border:1.5px solid var(--fail); border-radius:7px; color:var(--fail); font-family:'Space Grotesk',sans-serif; font-size:0.82rem; padding:9px 12px; cursor:pointer; }

    /* EMOJI PICKER */
    .emoji-grid { display:flex; flex-wrap:wrap; gap:6px; }
    .emoji-opt { background:var(--card); border:1.5px solid var(--border); border-radius:8px; font-size:1.3rem; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color 0.15s; }
    .emoji-opt.selected,.emoji-opt:hover { border-color:var(--accent); }

    /* TYPE SELECTOR */
    .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .type-opt { background:var(--card); border:1.5px solid var(--border); border-radius:8px; padding:10px 8px; cursor:pointer; text-align:center; transition:all 0.15s; }
    .type-opt.selected,.type-opt:hover { border-color:var(--accent); background:var(--accent-dim); }
    .type-opt-icon { font-size:1.2rem; margin-bottom:3px; }
    .type-opt-label { font-size:0.72rem; font-weight:600; }
    .type-opt-desc { font-size:0.6rem; color:var(--muted); margin-top:2px; }

    /* ACHIEVEMENT POPUP */
    .ach-popup { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px); background:var(--surface); border:1.5px solid var(--xp); border-radius:12px; padding:12px 18px; display:flex; align-items:center; gap:10px; z-index:500; transition:transform 0.4s ease; max-width:300px; width:90%; }
    .ach-popup.show { transform:translateX(-50%) translateY(0); }
    .ach-icon { font-size:1.6rem; }
    .ach-text-title { font-size:0.65rem; color:var(--xp); font-family:'Space Mono',monospace; letter-spacing:0.1em; text-transform:uppercase; }
    .ach-text-name { font-weight:700; font-size:0.9rem; }

    @media(max-width:480px){ .grid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr));} .stats{gap:5px;} }
  </style>
</head>
<body>

<nav id="nav"></nav>

<!-- Modals -->
<div class="modal-backdrop" id="modal-note">
  <div class="modal">
    <div class="modal-header"><div><div class="modal-title" id="note-title">Nota</div><div class="modal-sub" id="note-sub"></div></div><button class="modal-close" id="note-close">✕</button></div>
    <div class="modal-field"><div class="modal-label">Nota do dia</div><textarea id="note-text" placeholder="Como correu?"></textarea></div>
    <div class="modal-actions"><button class="btn-secondary" id="note-delete">Apagar</button><button class="btn-primary" id="note-save">Guardar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-adjust">
  <div class="modal">
    <div class="modal-header"><div><div class="modal-title" id="adjust-title">Ajustar valor</div><div class="modal-sub" id="adjust-sub"></div></div><button class="modal-close" id="adjust-close">✕</button></div>
    <div class="modal-field"><div class="modal-label">Novo valor</div><input type="number" id="adjust-val" min="1"></div>
    <div class="modal-field"><div class="modal-label">Motivo <span>(obrigatório)</span></div><textarea id="adjust-reason" placeholder="Ex: progressão natural..."></textarea></div>
    <div class="modal-actions"><button class="btn-secondary" id="adjust-cancel">Cancelar</button><button class="btn-primary" id="adjust-save">Confirmar</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-date">
  <div class="modal">
    <div class="modal-header"><div><div class="modal-title" id="date-title">Corrigir data</div></div><button class="modal-close" id="date-close">✕</button></div>
    <div class="modal-field"><div class="modal-label">Data de início</div><input type="date" id="date-val"></div>
    <div class="modal-actions"><button class="btn-secondary" id="date-cancel">Cancelar</button><button class="btn-primary" id="date-save">Guardar</button></div>
  </div>
</div>

<!-- Create/Edit Habit Modal -->
<div class="modal-backdrop" id="modal-habit">
  <div class="modal">
    <div class="modal-header"><div><div class="modal-title" id="habit-modal-title">Novo Hábito</div></div><button class="modal-close" id="habit-close">✕</button></div>

    <div class="modal-field">
      <div class="modal-label">Emoji</div>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <div class="modal-field">
      <div class="modal-label">Nome <span>(obrigatório)</span></div>
      <input type="text" id="habit-name" placeholder="ex: Meditação, Leitura...">
    </div>

    <div class="modal-field">
      <div class="modal-label">Tipo</div>
      <div class="type-grid" id="type-grid"></div>
    </div>

    <div class="modal-field" id="field-target">
      <div class="modal-label" id="label-target">Objetivo (máximo)</div>
      <input type="number" id="habit-target" min="1" placeholder="ex: 100">
    </div>

    <div class="modal-field" id="field-start">
      <div class="modal-label" id="label-start">Valor inicial</div>
      <input type="number" id="habit-start" min="1" placeholder="ex: 30">
    </div>

    <div class="modal-field">
      <div class="modal-label">Data de início</div>
      <input type="date" id="habit-date">

  {id:'streak21', icon:'💫', name:'Hábito a Formar',        desc:'21 dias consecutivos',     check:s=>s.maxStreak>=21},
  {id:'streak66', icon:'🧠', name:'Hábito Automático',      desc:'66 dias consecutivos',     check:s=>s.maxStreak>=66},
  {id:'streak90', icon:'👑', name:'Mestre da Consistência', desc:'90 dias consecutivos',     check:s=>s.maxStreak>=90},
  {id:'total7',   icon:'✅', name:'Primeiros Passos',       desc:'7 dias totais',            check:s=>s.totalDone>=7},
  {id:'total21',  icon:'🏃', name:'Em Movimento',           desc:'21 dias totais',           check:s=>s.totalDone>=21},
  {id:'total66',  icon:'⚡', name:'Força de Vontade',       desc:'66 dias totais',           check:s=>s.totalDone>=66},
  {id:'total90',  icon:'🏆', name:'Atleta Atómico',         desc:'90 dias totais',           check:s=>s.totalDone>=90},

const KEY='xpdaily_v2';

// ── STATE ────────────────────────────────────────────────
function defaultState(){
  return {
    habits:[]

}

function migrateFromV1(){
  try{
    const raw=localStorage.getItem(OLD_KEY);
    if(!raw) return null;
    const old=JSON.parse(raw);
    const flexData=old.flexoes;
    if(!flexData||!flexData.months) return null;
    // Build flexoes habit
    const habit={
      id:'flexoes',
      name:'Flexões',
      emoji:'💪',
      type:'reps',
      unit:'reps',
      target:100,
      unlockedAchievements:[],
      months: flexData.months.map((m,mi)=>{
        let days = m.days ? m.days.map(d=>typeof d==='boolean'?(d?(m.reps||30):null):d) : Array(DAYS_PER_MONTH).fill(null);
        // Force last 2 days of month 2 as done (always overwrite)
        if(mi===1){
          days[28]=m.reps||30;
          days[29]=m.reps||30;
        }
        // Set correct manualDates for each month
        const correctDates=['2026-06-17','2026-07-17','2026-08-17'];
        const manualDate = correctDates[mi] || m.manualDate || null;
        return {
          reps: m.reps,
          unlocked: m.unlocked||false,
          days,
          notes: m.notes||{},
          changelog: m.changelog||[],
          manualDate
        };
      })
    };
    return {habits:[habit]};
  }catch(e){ return null; }
}

function hardcodedFlexoes(){
  return {"habits":[{"id":"flexoes","name":"Flexões","emoji":"💪","type":"reps","unit":"reps","target":100,"unlockedAchievements":[],"months":[{"reps":30,"unlocked":true,"days":[30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],"notes":{},"changelog":[],"manualDate":"2026-06-17"},{"reps":32,"unlocked":true,"days":[32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32],"notes":{},"changelog":[],"manualDate":"2026-07-17"},{"reps":34,"unlocked":true,"days":[34,34,"x",34,34,34,34,34,34,34,34,34,34,34,34,34,"x",34,34,34,34,34,34,"x",34,34,34,34,34,34],"notes":{},"changelog":[],"manualDate":"2026-08-17"},{"reps":34,"unlocked":true,"days":[34,34,34,34,34,"x",34,34,34,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],"notes":{},"changelog":[],"manualDate":"2026-09-17"}]}]};
}

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s.habits) s.habits.forEach(h=>{ if(!h.unlockedAchievements) h.unlockedAchievements=[]; });
      // If flexoes has no real data (fresh localStorage), seed with hardcoded
      const flexHabit=s.habits&&s.habits.find(h=>h.id==='flexoes');
      if(!flexHabit||!flexHabit.months||flexHabit.months.length===0){
        const hc=hardcodedFlexoes();
        if(!s.habits) s.habits=[];
        s.habits=s.habits.filter(h=>h.id!=='flexoes');
        s.habits.unshift(hc.habits[0]);
        localStorage.setItem(KEY,JSON.stringify(s));
      }
      return s;
    }
    // No localStorage — use hardcoded data
    const hc=hardcodedFlexoes();
    localStorage.setItem(KEY,JSON.stringify(hc));
    return hc;
  }catch(e){}
  return hardcodedFlexoes();
}

function saveState(){ localStorage.setItem(KEY,JSON.stringify(state)); }

let state=loadState();
let activeHabitId=state.habits.length>0?state.habits[0].id:null;
let activeMonth=0;

// Retroactively unlock achievements for existing habits on first load
function retroCheckAchievements(){
  let changed=false;
  state.habits.forEach(habit=>{
    if(!habit.unlockedAchievements) habit.unlockedAchievements=[];
    // Use total days for total-based achievements (safe, no date dependency)
    const totalDone=habit.months.reduce((s,m)=>s+m.days.filter(d=>d!==null&&d!=='x').length,0);
    // For streak, try calcHabitStats but fallback to totalDone if 0
    let stats;
    try{ stats=calcHabitStats(habit); }catch(e){ stats={totalDone,streak:0,maxStreak:0}; }
    // If streak calc fails or returns 0 but we have many days, estimate maxStreak from totalDone
    if(stats.maxStreak===0&&totalDone>0) stats.maxStreak=totalDone;
    stats.totalDone=totalDone;
    ACHIEVEMENTS.forEach(ach=>{
      if(!habit.unlockedAchievements.includes(ach.id)&&ach.check(stats)){
        habit.unlockedAchievements.push(ach.id);
        changed=true;
      }
    });
  });
  if(changed) saveState();
}

// ── HELPERS ──────────────────────────────────────────────
function getHabit(id){ return state.habits.find(h=>h.id===id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtDate(d){ return PT_DAYS[d.getDay()]+' '+d.getDate()+' '+PT_MONTHS[d.getMonth()]; }
function fmtNow(){ const d=new Date(); return fmtDate(d)+' '+d.getFullYear(); }

function getMonthStart(habit,mi){
  const m=habit.months[mi];
  if(m.manualDate) return new Date(m.manualDate);
  if(mi===0) return new Date();
  const prev=habit.months[mi-1];
  if(prev.manualDate){ const d=new Date(prev.manualDate); d.setDate(d.getDate()+DAYS_PER_MONTH); return d; }
  return new Date();
}

function dayDate(habit,mi,di){ const d=getMonthStart(habit,mi); d.setDate(d.getDate()+di); return d; }

function monthDone(m){ return m.days.filter(d=>d!==null&&d!=='x').length; }
function monthTotal(m){ return m.days.reduce((s,v)=>s+(typeof v==='number'?v:0),0); }

function monthLabel(mi){ return 'Mês '+(mi+1); }
function monthColor(mi){ return MONTH_COLORS[mi%MONTH_COLORS.length]; }

function typeInfo(typeId){ return HABIT_TYPES.find(t=>t.id===typeId)||HABIT_TYPES[0]; }

function formatVal(habit,v){
  if(habit.type==='yesno') return v===1?'✅ Feito':'';
  return v+(v===1?'':'')+' '+typeInfo(habit.type).unit;
}

// ── XP & LEVELS ──────────────────────────────────────────
function xpPerDay(habit){ return habit.type==='dist'?15:10; }
function calcHabitXP(habit){ return habit.months.reduce((s,m)=>s+monthDone(m),0)*xpPerDay(habit); }
function calcTotalXP(){ return state.habits.reduce((s,h)=>s+calcHabitXP(h),0); }
function xpToLevel(xp){ return Math.floor(Math.sqrt(xp/50)); }
function levelToXP(lv){ return lv*lv*50; }
function getRank(lv){ let r=RANKS[0]; for(const rk of RANKS){ if(lv>=rk.min) r=rk; } return r; }

// ── STREAK ───────────────────────────────────────────────
function calcGlobalStats(){
  let totalDone=0, allDates=[];
  state.habits.forEach(habit=>{
    habit.months.forEach((m,mi)=>{
      m.days.forEach((v,di)=>{
        if(v!==null&&v!=='x'){
          totalDone++;
          allDates.push(dayDate(habit,mi,di).toDateString());
        }
      });
    });
  });
  const unique=[...new Set(allDates)].sort((a,b)=>new Date(a)-new Date(b));
  let maxStreak=0,cur=0;
  for(let i=0;i<unique.length;i++){
    if(i===0) cur=1;
    else{ const diff=(new Date(unique[i])-new Date(unique[i-1]))/(86400000); cur=diff===1?cur+1:1; }
    if(cur>maxStreak) maxStreak=cur;
  }
  let streak=0;
  if(unique.length>0){
    const last=new Date(unique[unique.length-1]); last.setHours(0,0,0,0);
    const today=new Date(); today.setHours(0,0,0,0);
    if((today-last)/86400000<=1){
      streak=1;
      for(let i=unique.length-2;i>=0;i--){
        if((new Date(unique[i+1])-new Date(unique[i]))/86400000===1) streak++;
        else break;
      }
    }
  }
  return {totalDone,streak,maxStreak};
}

// ── ACHIEVEMENTS ─────────────────────────────────────────
function calcHabitStats(habit){
  let totalDone=0, allDates=[];
  habit.months.forEach((m,mi)=>{
    m.days.forEach((v,di)=>{
      if(v!==null&&v!=='x'){
        totalDone++;
        allDates.push(dayDate(habit,mi,di).toDateString());
      }
    });
  });
  const unique=[...new Set(allDates)].sort((a,b)=>new Date(a)-new Date(b));
  let maxStreak=0,cur=0;
  for(let i=0;i<unique.length;i++){
    if(i===0) cur=1;
    else{ const diff=(new Date(unique[i])-new Date(unique[i-1]))/86400000; cur=diff===1?cur+1:1; }
    if(cur>maxStreak) maxStreak=cur;
  }
  let streak=0;
  if(unique.length>0){
    const last=new Date(unique[unique.length-1]); last.setHours(0,0,0,0);
    const today=new Date(); today.setHours(0,0,0,0);
    if((today-last)/86400000<=1){
      streak=1;
      for(let i=unique.length-2;i>=0;i--){
        if((new Date(unique[i+1])-new Date(unique[i]))/86400000===1) streak++;
        else break;
      }
    }
  }
  return {totalDone,streak,maxStreak};
}

function checkAchievements(){
  if(!activeHabitId) return;
  const habit=getHabit(activeHabitId);
  if(!habit.unlockedAchievements) habit.unlockedAchievements=[];
  const stats=calcHabitStats(habit);
  let found=null;
  ACHIEVEMENTS.forEach(ach=>{
    if(!habit.unlockedAchievements.includes(ach.id)&&ach.check(stats)){
      habit.unlockedAchievements.push(ach.id);
      found=ach;
    }
  });
  if(found){ saveState(); showAchPopup(found); }
}

let achTimer=null;
function showAchPopup(ach){
  document.getElementById('ach-icon').textContent=ach.icon;
  document.getElementById('ach-name').textContent=ach.name;
  const el=document.getElementById('ach-popup');
  el.classList.add('show');
  if(achTimer) clearTimeout(achTimer);
  achTimer=setTimeout(()=>el.classList.remove('show'),4000);
}

// ── MODAL CONTEXTS ───────────────────────────────────────
let noteCtx={hid:null,mi:null,di:null};
let adjustCtx={hid:null,mi:null};
let dateCtx={hid:null,mi:null};
let habitCtx={editing:null}; // null=new, id=editing

function openNote(hid,mi,di,e){
  e.stopPropagation(); noteCtx={hid,mi,di};

  document.getElementById('note-title').textContent=habit.emoji+' '+habit.name+' — '+monthLabel(mi)+' Dia '+(di+1);

function closeNote(){document.getElementById('modal-note').classList.remove('open');}
function saveNote(){
  const val=document.getElementById('note-text').value.trim();
  const m=getHabit(noteCtx.hid).months[noteCtx.mi];
  if(!m.notes)m.notes={};
  if(val)m.notes[noteCtx.di]=val; else delete m.notes[noteCtx.di];
  saveState();closeNote();render();
}
function deleteNote(){
  const m=getHabit(noteCtx.hid).months[noteCtx.mi];
  if(m.notes)delete m.notes[noteCtx.di];
  saveState();closeNote();render();
}

function openAdjust(hid,mi){
  adjustCtx={hid,mi};
  const habit=getHabit(hid),m=habit.months[mi],ti=typeInfo(habit.type);
  document.getElementById('adjust-title').textContent=habit.emoji+' Ajustar '+habit.name+' — '+monthLabel(mi);
  document.getElementById('adjust-sub').textContent='Atual: '+(m.reps||'—')+' '+ti.unit+' · Objetivo: '+habit.target+' '+ti.unit;

  document.getElementById('adjust-reason').value='';
  document.getElementById('modal-adjust').classList.add('open');
  setTimeout(()=>document.getElementById('adjust-val').focus(),50);
}
function closeAdjust(){document.getElementById('modal-adjust').classList.remove('open');}
function saveAdjust(){
  const val=parseInt(document.getElementById('adjust-val').value);
  const reason=document.getElementById('adjust-reason').value.trim();
  if(!val||val<1){alert('Valor inválido.');return;}
  if(!reason){alert('Escreve o motivo!');return;}
  const habit=getHabit(adjustCtx.hid),m=habit.months[adjustCtx.mi],ti=typeInfo(habit.type);
  m.changelog.push({date:fmtNow(),from:m.reps,to:val,unit:ti.unit,reason});

}

function openDateEdit(hid,mi){
  dateCtx={hid,mi};

function closeDateEdit(){document.getElementById('modal-date').classList.remove('open');}
function saveDateEdit(){

  if(!val){alert('Seleciona uma data.');return;}

// ── HABIT MODAL ──────────────────────────────────────────
let selectedEmoji=EMOJIS[0];
let selectedType='reps';

function buildEmojiGrid(){
  const grid=document.getElementById('emoji-grid'); grid.innerHTML='';
  EMOJIS.forEach(em=>{
    const d=document.createElement('div');
    d.className='emoji-opt'+(em===selectedEmoji?' selected':'');

    d.onclick=()=>{selectedEmoji=em;buildEmojiGrid();};
    grid.appendChild(d);
  });
}

function buildTypeGrid(){
  const grid=document.getElementById('type-grid'); grid.innerHTML='';
  HABIT_TYPES.forEach(t=>{
    const d=document.createElement('div');
    d.className='type-opt'+(t.id===selectedType?' selected':'');
    d.innerHTML=`<div class="type-opt-icon">${t.icon}</div><div class="type-opt-label">${t.label}</div><div class="type-opt-desc">${t.desc}</div>`;
    d.onclick=()=>{selectedType=t.id;buildTypeGrid();updateTypeFields();};

  });

function updateTypeFields(){
  const ti=typeInfo(selectedType);
  const isYesNo=selectedType==='yesno';
  document.getElementById('field-target').style.display=isYesNo?'none':'flex';
  document.getElementById('field-start').style.display=isYesNo?'none':'flex';
  document.getElementById('label-target').textContent='Objetivo (máximo) em '+ti.unit;
  document.getElementById('label-start').textContent='Valor inicial em '+ti.unit;
}

function openHabitModal(editingId){
  habitCtx.editing=editingId||null;
  const isEdit=!!editingId;
  document.getElementById('habit-modal-title').textContent=isEdit?'Editar Hábito':'Novo Hábito';
  document.getElementById('habit-save').textContent=isEdit?'Guardar':'Criar hábito';
  document.getElementById('habit-delete').style.display=isEdit?'flex':'none';

  if(isEdit){
    const h=getHabit(editingId);
    selectedEmoji=h.emoji; selectedType=h.type;
    document.getElementById('habit-name').value=h.name;
    document.getElementById('habit-target').value=h.target||'';
    document.getElementById('habit-start').value=h.months[0].reps||'';
    const s=getMonthStart(h,0);
    document.getElementById('habit-date').value=s.toISOString().split('T')[0];
  } else {
    selectedEmoji=EMOJIS[0]; selectedType='reps';
    document.getElementById('habit-name').value='';
    document.getElementById('habit-target').value='';
    document.getElementById('habit-start').value='';
    const today=new Date(); document.getElementById('habit-date').value=today.toISOString().split('T')[0];
  }
  buildEmojiGrid(); buildTypeGrid(); updateTypeFields();
  document.getElementById('modal-habit').classList.add('open');
}
function closeHabitModal(){document.getElementById('modal-habit').classList.remove('open');}

function saveHabit(){
  const name=document.getElementById('habit-name').value.trim();
  if(!name){alert('Dá um nome ao hábito!');return;}
  const isYesNo=selectedType==='yesno';
  const target=isYesNo?1:parseInt(document.getElementById('habit-target').value)||100;
  const startVal=isYesNo?1:parseInt(document.getElementById('habit-start').value)||null;
  const dateVal=document.getElementById('habit-date').value;
  const ti=typeInfo(selectedType);

  if(habitCtx.editing){
    const h=getHabit(habitCtx.editing);
    h.name=name; h.emoji=selectedEmoji; h.type=selectedType; h.unit=ti.unit; h.target=target;
    if(dateVal) h.months[0].manualDate=dateVal;
  } else {
    const newHabit={
      id:uid(), name, emoji:selectedEmoji, type:selectedType, unit:ti.unit, target,
      unlockedAchievements:[],
      months:[{reps:startVal,unlocked:true,days:Array(DAYS_PER_MONTH).fill(null),notes:{},changelog:[],manualDate:dateVal||new Date().toISOString().split('T')[0]}]
    };
    state.habits.push(newHabit);
    activeHabitId=newHabit.id;
    activeMonth=0;
  }
  saveState(); closeHabitModal(); render();
}

function deleteHabit(){
  if(!confirm('Tens a certeza que queres apagar este hábito? Todo o progresso será perdido.')) return;
  state.habits=state.habits.filter(h=>h.id!==habitCtx.editing);
  activeHabitId=state.habits.length>0?state.habits[0].id:null;
  activeMonth=0;
  saveState(); closeHabitModal(); render();
}

function addMonths(n){
  const habit=getHabit(activeHabitId);
  for(let i=0;i<n;i++){
    habit.months.push({reps:null,unlocked:false,days:Array(DAYS_PER_MONTH).fill(null),notes:{},changelog:[],manualDate:null});
  }
  saveState(); render();
}

  });
  const add=document.createElement('button');
  add.className='nav-btn nav-add'; add.textContent='＋';
  add.title='Novo hábito';
  add.onclick=()=>openHabitModal(null);
  nav.appendChild(add);
}

function renderHero(){
  const wrap=document.getElementById('hero-wrap'); wrap.innerHTML='';
  const totalXP=calcTotalXP();
  const lv=xpToLevel(totalXP), rank=getRank(lv);
  const thisXP=levelToXP(lv), nextXP=levelToXP(lv+1);
  const pct=Math.min(100,((totalXP-thisXP)/(nextXP-thisXP)*100)).toFixed(1);
  const stats=calcGlobalStats();

  const div=document.createElement('div'); div.className='hero';
  div.innerHTML=`
    <div class="hero-top">
      <div class="avatar">${rank.emoji}</div>
      <div class="hero-info">
        <div class="hero-name">XP Daily · Personagem</div>
        <div class="hero-level">Nível <span>${lv}</span> — ${rank.label}</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:'Space Mono',monospace;font-size:0.95rem;color:var(--xp);font-weight:700">${totalXP} XP</div>
        <div style="font-size:0.6rem;color:var(--muted)">próx: ${nextXP} XP</div>
      </div>
    </div>
    <div class="xp-bar-meta"><span>XP Global</span><span class="xp-val">${totalXP-thisXP} / ${nextXP-thisXP} XP</span></div>
    <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:${pct}%"></div></div>
    <div class="streak-row">
      <div class="streak-badge fire"><div class="streak-val">🔥 ${stats.streak}</div><div class="streak-label">Streak atual</div></div>
      <div class="streak-badge"><div class="streak-val">${stats.maxStreak}</div><div class="streak-label">Melhor streak</div></div>
      <div class="streak-badge"><div class="streak-val">${stats.totalDone}</div><div class="streak-label">Dias totais</div></div>
    </div>`;

  // Achievements per active habit
  if(activeHabitId){
    const activeHabit=getHabit(activeHabitId);
    if(!activeHabit.unlockedAchievements) activeHabit.unlockedAchievements=[];
    div.innerHTML+=`<div class="section-title">🏅 Conquistas — ${activeHabit.emoji} ${activeHabit.name}</div>`;
    const achGrid=document.createElement('div'); achGrid.className='achievements-grid';
    ACHIEVEMENTS.forEach(ach=>{
      const unlocked=activeHabit.unlockedAchievements.includes(ach.id);
      const b=document.createElement('div'); b.className='badge'+(unlocked?' unlocked':'');
      b.innerHTML=`<span class="badge-icon">${ach.icon}</span><span>${ach.name}<br><span style="font-size:0.58rem;opacity:0.6">${ach.desc}</span></span>`;
      achGrid.appendChild(b);
    });
    div.appendChild(achGrid);
  }

  // Skills
  if(state.habits.length>0){
    const st=document.createElement('div'); st.className='section-title'; st.style.marginTop='6px'; st.textContent='⚡ Skills';
    div.appendChild(st);
    const skillsDiv=document.createElement('div'); skillsDiv.className='skills-overview';
    state.habits.forEach(habit=>{
      const xp=calcHabitXP(habit),lv=xpToLevel(xp),rank=getRank(lv);
      const thisXP=levelToXP(lv),nextXP=levelToXP(lv+1);
      const pct=nextXP>thisXP?Math.min(100,((xp-thisXP)/(nextXP-thisXP)*100)).toFixed(0):100;
      const row=document.createElement('div'); row.className='skill-row';
      row.innerHTML=`<div class="skill-emoji">${habit.emoji}</div><div class="skill-info"><div class="skill-name">${habit.name}</div><div class="skill-rank">${rank.emoji} ${rank.label} · ${xp} XP</div></div><div class="skill-xp-bar"><div class="skill-xp-bg"><div class="skill-xp-fill" style="width:${pct}%"></div></div><div class="skill-lv">Lv ${lv}</div></div>`;
      row.onclick=()=>{activeHabitId=habit.id;activeMonth=0;render();};
      skillsDiv.appendChild(row);
    });
    div.appendChild(skillsDiv);
  }
  wrap.appendChild(div);
}

function renderMonthNav(){
  const wrap=document.getElementById('month-nav-wrap'); wrap.innerHTML='';
  if(!activeHabitId){wrap.innerHTML='';return;}
  const habit=getHabit(activeHabitId);
  const div=document.createElement('div'); div.className='month-nav';
  habit.months.forEach((m,mi)=>{
    const done=monthDone(m);
    const prevOk=mi===0||monthDone(habit.months[mi-1])>=Math.ceil(DAYS_PER_MONTH*MIN_PCT);
    const canSee=m.unlocked||prevOk;
    const color=monthColor(mi);
    const btn=document.createElement('button');
    btn.className='month-btn'+(canSee?'':' locked-month')+(activeMonth===mi&&canSee?' active':'')+' ';
    if(activeMonth===mi&&canSee) btn.style.cssText=`border-color:var(--${color});color:var(--${color});background:rgba(var(--${color}-rgb,200,241,53),0.08)`;
    btn.innerHTML=monthLabel(mi)+'<span class="month-label-sub">'+(canSee?done+'/30':'🔒')+'</span>';
    btn.onclick=()=>{if(canSee){activeMonth=mi;render();}};
    div.appendChild(btn);
  });
  wrap.appendChild(div);
}

function renderSection(){
  const container=document.getElementById('sections'); container.innerHTML='';
  if(!activeHabitId){
    container.innerHTML=`<div class="locked-overlay" style="padding:60px 20px"><div class="lock-icon">✨</div><p>Ainda não tens hábitos.<br>Clica em <strong>＋</strong> para criar o primeiro!</p></div>`;
    return;
  }
  const habit=getHabit(activeHabitId);
  const sec=document.createElement('div'); sec.className='section active';
  container.appendChild(sec);

  // Dashboard
  renderDashboard(habit,sec);

  const m=habit.months[activeMonth];
  const prevOk=activeMonth===0||monthDone(habit.months[activeMonth-1])>=Math.ceil(DAYS_PER_MONTH*MIN_PCT);

  if(!m.unlocked){
    const ml=document.createElement('div'); ml.className='month-locked';
    if(prevOk){
      const ti=typeInfo(habit.type);
      ml.innerHTML=`<div class="lock-icon">🎉</div><p>Parabéns! Desbloqueia o ${monthLabel(activeMonth)}.</p><div class="config-bar" style="justify-content:center"><label>${ti.unit?ti.label+' ('+ti.unit+')':'Valor'}<input type="number" id="month-unlock-inp" min="1" placeholder="${habit.months[activeMonth-1].reps||''}"></label><button id="btn-month-unlock">Começar ${monthLabel(activeMonth)}</button></div>`;
      sec.appendChild(ml);
      document.getElementById('btn-month-unlock').onclick=()=>{
        const val=habit.type==='yesno'?1:parseInt(document.getElementById('month-unlock-inp').value);
        if(!val||val<1){alert('Valor inválido.');return;}
        m.unlocked=true; m.reps=val;
        const td=new Date(); m.manualDate=td.toISOString().split('T')[0];
        saveState();render();
      };
    } else {
      const need=Math.ceil(DAYS_PER_MONTH*MIN_PCT);
      const havePrev=monthDone(habit.months[activeMonth-1]);
      ml.innerHTML=`<div class="lock-icon">📅</div><p>Faltam ${need-havePrev} dias no ${monthLabel(activeMonth-1)} para desbloquear.<br><span style="font-size:0.75rem;color:var(--muted)">(mínimo 80% — ${need}/30 dias)</span></p>`;
      sec.appendChild(ml);
    }
    return;
  }

  const done=monthDone(m), failed=m.days.filter(d=>d==='x').length;
  const pct=(done/DAYS_PER_MONTH*100).toFixed(1);
  const total=monthTotal(m);
  const color=monthColor(activeMonth);
  const ti=typeInfo(habit.type);
  const isLast=activeMonth===habit.months.length-1;

  const changelogHTML=m.changelog&&m.changelog.length?`<div class="changelog"><div class="changelog-title">📋 Historial</div>${m.changelog.map(e=>`<div class="changelog-entry"><div class="cl-meta">${e.date} · ${e.from}→${e.to} ${e.unit}</div><div class="cl-reason">${e.reason}</div></div>`).join('')}</div>`:'';

  const body=document.createElement('div');
  body.innerHTML=`
    <div class="section-topbar">
      <div class="topbar-info">
        ${habit.type!=='yesno'?`Valor atual: <strong>${m.reps||'—'} ${ti.unit}</strong><br>`:''}
        Início: ${fmtDate(getMonthStart(habit,activeMonth))}
      </div>
      <div class="topbar-btns">
        ${habit.type!=='yesno'?`<button class="btn-sm" id="btn-adj">⚙️ Ajustar valor</button>`:''}
        <button class="btn-sm" id="btn-date">📅 Corrigir data</button>
        <button class="btn-sm danger" id="btn-edit">✏️ Editar hábito</button>
      </div>
    </div>
    ${changelogHTML}
    <div class="progress-wrap">
      <div class="progress-meta"><span>${habit.name} · ${monthLabel(activeMonth)}</span><strong>${done} / ${DAYS_PER_MONTH} dias</strong></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--done),var(--${color}))"></div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val">${done}</div><div class="stat-label">Concluídos</div></div>
      ${habit.type!=='yesno'?`<div class="stat"><div class="stat-val">${total>0?total.toLocaleString('pt-PT'):'—'}</div><div class="stat-label">Total ${ti.unit}</div></div>`:''}
      <div class="stat"><div class="stat-val" style="${failed>0?'color:var(--fail)':''}">${failed}</div><div class="stat-label">Falhados</div></div>
    </div>
    <div class="grid" id="main-grid"></div>
    ${isLast?`<div class="add-month-wrap"><div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);width:100%;margin-bottom:2px;letter-spacing:0.1em;text-transform:uppercase">➕ Adicionar mais meses</div><button class="btn-add-months" id="add-30">+30 dias</button><button class="btn-add-months" id="add-60">+60 dias</button><button class="btn-add-months" id="add-90">+90 dias</button></div>`:''}`;
  sec.appendChild(body);

  if(document.getElementById('btn-adj')) document.getElementById('btn-adj').onclick=()=>openAdjust(activeHabitId,activeMonth);
  document.getElementById('btn-date').onclick=()=>openDateEdit(activeHabitId,activeMonth);
  document.getElementById('btn-edit').onclick=()=>openHabitModal(activeHabitId);
  if(isLast){
    document.getElementById('add-30').onclick=()=>addMonths(1);
    document.getElementById('add-60').onclick=()=>addMonths(2);
    document.getElementById('add-90').onclick=()=>addMonths(3);
  }

  const grid=document.getElementById('main-grid');
  m.days.forEach((dayVal,i)=>{
    const isDone=dayVal!==null&&dayVal!=='x', isFailed=dayVal==='x';
    const hasNote=!!(m.notes&&m.notes[i]);
    const repsLabel=isFailed?'Falhado':isDone?(habit.type==='yesno'?'✅ Feito':(dayVal+' '+ti.unit)):(habit.type==='yesno'?'—':(m.reps?m.reps+' '+ti.unit:'— '+ti.unit));
    const ringIcon=isFailed?'✕':isDone?'✓':'';
    const card=document.createElement('div');
    card.className='card'+(isDone?' done':isFailed?' failed':'');
    card.innerHTML=`
      <button class="note-btn ${hasNote?'has-note':''}">${hasNote?'📝':'✏️'}</button>
      <button class="x-btn">${isFailed?'↩️':'❌'}</button>
      <span class="card-date">${fmtDate(dayDate(habit,activeMonth,i))}</span>
      <span class="day-num">Dia ${i+1}</span>
      <div class="check-ring"><span class="checkmark">${ringIcon}</span></div>
      <span class="card-reps">${repsLabel}</span>`;
    card.querySelector('.note-btn').onclick=e=>openNote(activeHabitId,activeMonth,i,e);
    card.querySelector('.x-btn').onclick=e=>{
      e.stopPropagation();
      m.days[i]=isFailed?null:'x';
      saveState();checkAchievements();render();
    };
    card.onclick=()=>{
      const cur=m.days[i];
      if(cur===null||cur==='x') m.days[i]=habit.type==='yesno'?1:(m.reps||0);
      else m.days[i]=null;
      saveState();checkAchievements();render();
    };
    grid.appendChild(card);
  });
}

function renderDashboard(habit,container){
  const months=habit.months;
  const totalDays=months.reduce((s,m)=>s+monthDone(m),0);
  const totalReps=months.reduce((s,m)=>s+monthTotal(m),0);
  const hXP=calcHabitXP(habit), hLv=xpToLevel(hXP), rank=getRank(hLv);
  const ti=typeInfo(habit.type);

  const dash=document.createElement('div'); dash.className='dashboard';
  dash.innerHTML=`
    <div class="section-title">📊 ${habit.emoji} ${habit.name}</div>
    <div class="dash-hero">
      <div class="dash-big"><div class="dash-big-val">${totalDays}</div><div class="dash-big-label">Dias feitos</div></div>
      ${habit.type!=='yesno'?`<div class="dash-big"><div class="dash-big-val">${totalReps>0?totalReps.toLocaleString('pt-PT'):'—'}</div><div class="dash-big-label">Total ${ti.unit}</div></div>`:''}
      <div class="dash-big"><div class="dash-big-val" style="color:var(--xp)">${hXP}</div><div class="dash-big-label">${rank.emoji} Lv ${hLv}</div></div>
    </div>
    <div class="dash-months">
      ${months.map((m,mi)=>{const d=monthDone(m),r=monthTotal(m),c=monthColor(mi);return`<div class="dash-month-card"><div class="dash-month-val" style="color:var(--${c})">${d}/30</div><div class="dash-month-label">${monthLabel(mi)}</div>${habit.type!=='yesno'?`<div style="font-size:0.55rem;color:var(--muted)">${r>0?r.toLocaleString('pt-PT')+' '+ti.unit:'—'}</div>`:''}</div>`;}).join('')}
    </div>
    <div class="dash-bar-wrap">
      ${months.map((m,mi)=>{const d=monthDone(m),pct=(d/DAYS_PER_MONTH*100).toFixed(0),c=monthColor(mi);return`<div class="dash-bar-row"><div class="dash-bar-name">${monthLabel(mi)}</div><div class="dash-bar-bg"><div class="dash-bar-fill" style="width:${pct}%;background:var(--${c})"></div></div><div class="dash-bar-pct">${pct}%</div></div>`;}).join('')}
    </div>`;
  container.appendChild(dash);
}

retroCheckAchievements();
render();
</script>
</body>
</html>
